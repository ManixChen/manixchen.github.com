<header class="site-header" v-cloak>
  <div class="container site-header-inner">
    <a class="site-brand" href="{{ site.baseurl | prepend: site.url }}" title="{{ site.title }}">
      <span class="site-brand-mark">M</span>
      <span class="site-brand-text">{{ site.title }}</span>
    </a>

    <nav class="site-nav" aria-label="Main Navigation">
      <a class="nav-link {% if page.url == '/index.html' or page.url == '/' %}active{% endif %}" href="{{ site.baseurl | prepend: site.url }}/">首页</a>
      {% for p in site.pages %}
      {% if p.isNavItem %}
      <a class="nav-link {% if p.url == page.url %}active{% endif %}" href="{{ p.url | prepend: site.baseurl | prepend: site.url }}">
        {{ p.title }}
      </a>
      {% endif %}
      {% endfor %}
    </nav>

    <div class="search-container">
      <label for="pageSearch" class="sr-only">Search pages</label>
      <input name="pageSearch" class="search" id="pageSearch" placeholder="搜索文章 / 标签" />
      <ul id="searchResultScontainer"></ul>
    </div>
  </div>
</header>
